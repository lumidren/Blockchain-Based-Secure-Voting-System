[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 2000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
gas_reports = ["Election", "Tally", "TrusteeCoordinator", "VoterRegistry", "VeriVoteFactory"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
ffi = false
verbosity = 2

[profile.default.fuzz]
runs = 512
max_test_rejects = 131072

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = false
call_override = false

[profile.ci]
fuzz = { runs = 4096 }
invariant = { runs = 512, depth = 64 }

[profile.lite]
optimizer = false
fuzz = { runs = 32 }
invariant = { runs = 8, depth = 8 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }
